# Logs on the squid_logs volume. Run hourly by xares-entrypoint.sh (cron is
# not running in the container); the state file lives on the volume, so
# "daily" also holds across container recreation.
/var/log/squid/*.log {
	daily
	maxsize 100M
	rotate 14
	compress
	delaycompress
	missingok
	notifempty
	nocreate
	sharedscripts
	postrotate
		# Quiet: it prints every config warning; logrotate reports a failure
		test ! -e /run/squid.pid || /usr/sbin/squid -k rotate >/dev/null 2>&1
	endscript
}
