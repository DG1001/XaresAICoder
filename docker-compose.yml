# Docker logs of every service are rotated by size (dnsmasq, mitmproxy and
# squid write a line per request); the server applies the same to workspaces
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

services:
  nginx:
    image: nginx:1.29.0-alpine
    container_name: xaresaicoder-nginx
    logging: *default-logging
    ports:
      - "${HOST_PORT}:80"
    volumes:
      - ./build/nginx.conf.template:/etc/nginx/templates/default.conf.template
      - ./frontend:/usr/share/nginx/html/frontend
      - nginx_dynamic:/etc/nginx/dynamic
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - BASE_PORT=${BASE_PORT:-80}
      - PROTOCOL=${PROTOCOL:-http}
    depends_on:
      - server
    networks:
      xares-control:           # API server and Forgejo (no workspaces)
      xares-aicoder-network:   # Direct workspaces (no proxy)
      xares-internal:          # LLM Logging Proxy workspaces
        ipv4_address: 172.30.0.4
      xares-security:          # Security Proxy workspaces
    restart: unless-stopped

  server:
    image: ${SERVER_IMAGE:-xares-aicoder-server:local}
    logging: *default-logging
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - DOCKER_NETWORK=${DOCKER_NETWORK:-xares-aicoder-network}
      - MAX_WORKSPACES_PER_USER=${MAX_WORKSPACES_PER_USER:-5}
      - MAX_CONCURRENT_WORKSPACES=${MAX_CONCURRENT_WORKSPACES:-3}
      - CPU_PER_WORKSPACE=${CPU_PER_WORKSPACE:-1.0}
      - MEMORY_PER_WORKSPACE_MB=${MEMORY_PER_WORKSPACE_MB:-4096}
      - ENABLE_RESOURCE_LIMITS=${ENABLE_RESOURCE_LIMITS:-true}
      - BASE_DOMAIN=${BASE_DOMAIN:-localhost}
      - BASE_PORT=${BASE_PORT:-80}
      - PROTOCOL=${PROTOCOL:-http}
      - ENABLE_GIT_SERVER=${ENABLE_GIT_SERVER:-false}
      - GIT_ADMIN_USER=${GIT_ADMIN_USER:-developer}
      - GIT_ADMIN_PASSWORD=${GIT_ADMIN_PASSWORD:-admin123!}
      - GIT_ADMIN_EMAIL=${GIT_ADMIN_EMAIL:-gitadmin@xaresaicoder.local}
      - CODESERVER_IMAGE=${CODESERVER_IMAGE:-xares-aicoder-codeserver:latest}
      - ENABLE_GPU=${ENABLE_GPU:-false}
      - SHOW_DISK_USAGE=${SHOW_DISK_USAGE:-false}
      - ENABLE_PROXY=${ENABLE_PROXY:-false}
      - CONTAINER_PIDS_LIMIT=${CONTAINER_PIDS_LIMIT:-512}
      - CONTAINER_MAX_FDS=${CONTAINER_MAX_FDS:-4096}
      - CONTAINER_MAX_FDS_HARD=${CONTAINER_MAX_FDS_HARD:-8192}
      - CONTAINER_MAX_PROCS=${CONTAINER_MAX_PROCS:-512}
      - CONTAINER_MAX_PROCS_HARD=${CONTAINER_MAX_PROCS_HARD:-1024}
      - WORKSPACE_SUDO_ENABLED=${WORKSPACE_SUDO_ENABLED:-false}
      - WORKSPACE_SECCOMP=${WORKSPACE_SECCOMP:-default}
      - WORKSPACE_DISK_LIMIT=${WORKSPACE_DISK_LIMIT:-}
      - PROXY_NETWORK=${PROXY_NETWORK:-xaresaicoder_xares-internal}
      - SECURITY_PROXY_NETWORK=${SECURITY_PROXY_NETWORK:-xaresaicoder_xares-security}
      - SECURITY_DNSMASQ_IP=${SECURITY_DNSMASQ_IP:-172.31.255.254}
      - WORKSHOP_GROUP=${WORKSHOP_GROUP:-}
      - WORKSHOP_ADMIN_PASSWORD=${WORKSHOP_ADMIN_PASSWORD:-}
      # Dashboard/API login; without it the API stays locked (deploy.sh generates one)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_SESSION_HOURS=${ADMIN_SESSION_HOURS:-168}
      # Reverse proxies on other machines whose X-Forwarded-For nginx trusts
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - NGINX_CONTAINER_NAME=${NGINX_CONTAINER_NAME:-xaresaicoder-nginx}
      - NGINX_DYNAMIC_DIR=/app/nginx-dynamic
      - NGINX_VIEW_DIR=/etc/nginx/dynamic
      - LOG_MAX_SIZE=${LOG_MAX_SIZE:-10m}
      - LOG_MAX_FILE=${LOG_MAX_FILE:-3}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspace_data:/app/workspaces
      - nginx_dynamic:/app/nginx-dynamic
    networks:
      # Only the control network: workspaces must not reach the API directly
      - xares-control
    restart: unless-stopped

  forgejo:
    image: codeberg.org/forgejo/forgejo:9.0.3
    container_name: xaresaicoder-forgejo
    logging: *default-logging
    profiles: ["git-server"]
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__database__PATH=/data/gitea/gitea.db
      - FORGEJO__server__DOMAIN=${BASE_DOMAIN:-localhost}
      - FORGEJO__server__SSH_DOMAIN=${BASE_DOMAIN:-localhost}
      - FORGEJO__server__ROOT_URL=${PROTOCOL:-http}://${BASE_DOMAIN:-localhost}:${BASE_PORT:-80}/git/
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__SSH_PORT=2222
      - FORGEJO__server__LFS_START_SERVER=true
      - FORGEJO__server__OFFLINE_MODE=true
      - FORGEJO__actions__ENABLED=true
      - FORGEJO__actions__DEFAULT_ACTIONS_URL=https://code.forgejo.org
      - FORGEJO__security__INSTALL_LOCK=true
      # Signs sessions/CSRF tokens and encrypts stored secrets. An empty value
      # is written to app.ini as empty, so it must be set (deploy.sh generates
      # it). INTERNAL_TOKEN and the JWT secrets are generated by Forgejo.
      - FORGEJO__security__SECRET_KEY=${FORGEJO_SECRET_KEY:?FORGEJO_SECRET_KEY is not set - run ./deploy.sh or set it in .env}
      - FORGEJO__service__DISABLE_REGISTRATION=true
      # Nothing visible without a login (old public repositories, user list)
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=${GIT_REQUIRE_SIGNIN_VIEW:-true}
      - FORGEJO__service__DEFAULT_ALLOW_CREATE_ORGANIZATION=true
      - FORGEJO__log__LEVEL=info
    volumes:
      - forgejo_data:/data
    ports:
      - "2222:22"  # SSH access for git operations
    networks:
      - xares-control
      - xares-aicoder-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  squid-proxy:
    build:
      context: ./squid
      dockerfile: Dockerfile
    container_name: xaresaicoder-squid-proxy
    logging: *default-logging
    profiles: ["proxy"]
    environment:
      # Only clients from this subnet may use the whitelist (squid.conf ACL)
      - SECURITY_NETWORK_SUBNET=${SECURITY_NETWORK_SUBNET:-172.31.0.0/16}
    volumes:
      - ./squid/certs:/etc/squid/certs:ro
      - squid_logs:/var/log/squid
      - squid_whitelist:/etc/squid/whitelist  # applied whitelist survives redeploys
    ports:
      - "3128:3128"  # HTTP proxy port (for debugging/monitoring)
    networks:
      xares-aicoder-network:  # Internet access
      xares-security:          # Security Proxy workspaces only
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "timeout", "2", "bash", "-c", "</dev/tcp/localhost/3128"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mitmproxy-logger:
    image: mitmproxy/mitmproxy:12.2.1
    container_name: xaresaicoder-mitmproxy-logger
    logging: *default-logging
    profiles: ["proxy"]
    user: root
    volumes:
      - ./mitmproxy/llm-logger.py:/scripts/llm-logger.py:ro
      - mitmproxy_logs:/var/log/mitmproxy
      - ./squid/certs:/certs
    command: >
      sh -c "mkdir -p /var/log/mitmproxy/llm_conversations /var/log/mitmproxy/domains &&
      chmod -R 777 /var/log/mitmproxy &&
      mitmdump
      --mode regular
      --listen-host 0.0.0.0
      --listen-port 8080
      --set confdir=/certs
      --set ssl_insecure=true
      -s /scripts/llm-logger.py"
    networks:
      xares-internal:
        ipv4_address: 172.30.0.5
      xares-aicoder-network:
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8080)); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dnsmasq:
    # dnsmasq 2.84rc2; the image has no version tag for it, so pinned by digest
    image: andyshinn/dnsmasq:latest@sha256:4fea93e30551a5971e8934c4b47f70d293c2774a9c7dae1edb1a663e2b2402a3
    container_name: xaresaicoder-dnsmasq
    logging: *default-logging
    profiles: ["proxy"]
    cap_add:
      - NET_ADMIN
    command: >
      --no-daemon
      --log-queries
      --server=8.8.8.8
      --server=8.8.4.4
      --server=1.1.1.1
    networks:
      xares-internal:
        ipv4_address: ${DNSMASQ_IP:-172.30.0.2}  # Fixed IP for DNS server
      xares-security:
        # Last address: nginx and squid get dynamic addresses on this network
        # and would otherwise race dnsmasq for .2
        ipv4_address: ${SECURITY_DNSMASQ_IP:-172.31.255.254}
    restart: unless-stopped

networks:
  # nginx, API server and Forgejo. Workspaces are never attached.
  xares-control:
    driver: bridge
  # Direct workspaces (no proxy), plus the proxies' internet access
  xares-aicoder-network:
    external: true
  # LLM Logging Proxy workspaces <-> mitmproxy
  xares-internal:
    driver: bridge
    internal: true  # No internet access - forces traffic through proxy
    ipam:
      config:
        - subnet: ${INTERNAL_NETWORK_SUBNET:-172.30.0.0/16}
  # Security Proxy workspaces <-> squid. Separate from xares-internal so that
  # whitelisted workspaces cannot use the unrestricted mitmproxy instead.
  xares-security:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${SECURITY_NETWORK_SUBNET:-172.31.0.0/16}

volumes:
  workspace_data:
  forgejo_data:
  squid_logs:
  squid_whitelist:
  mitmproxy_logs:
  nginx_dynamic: